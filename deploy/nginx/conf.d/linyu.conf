map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream official_upstream {
    server official:80;
}

upstream api_upstream {
    server api:9088;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name linyu.chat www.linyu.chat;
    return 301 https://linyu.chat$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.linyu.chat;
    return 301 https://api.linyu.chat$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.linyu.chat;

    ssl_certificate     /etc/nginx/certs/linyu.chat.crt;
    ssl_certificate_key /etc/nginx/certs/linyu.chat.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://linyu.chat$request_uri;
}

# 官网 https://linyu.chat
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name linyu.chat;

    ssl_certificate     /etc/nginx/certs/linyu.chat.crt;
    ssl_certificate_key /etc/nginx/certs/linyu.chat.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://official_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API https://api.linyu.chat
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.linyu.chat;

    ssl_certificate     /etc/nginx/certs/api.linyu.chat.crt;
    ssl_certificate_key /etc/nginx/certs/api.linyu.chat.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
