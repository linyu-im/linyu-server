map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

upstream official_upstream {
    server official:80;
}

upstream api_upstream {
    server api:9088;
}

# www → apex
server {
    listen 80;
    listen [::]:80;
    server_name www.linyu.chat;
    return 301 http://linyu.chat$request_uri;
}

# 官网 linyu.chat
server {
    listen 80;
    listen [::]:80;
    server_name linyu.chat;

    location / {
        proxy_pass http://official_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# API api.linyu.chat
server {
    listen 80;
    listen [::]:80;
    server_name api.linyu.chat;

    client_max_body_size 100m;

    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
