#关系型数据库
rdb:
  type: mysql
  mysql:
    host: 127.0.0.1
    port: 3306
    user: root
    password: 123456
    database: linyu
    timezone: Asia/Shanghai
  sqlite:
    db-path: ./linyu/db
    db-name: linyu

#对象存储
storage:
  type: local
  space-quota: 1073741824 
  local:
    base-url: http://localhost:9088
    file-path: ./linyu/storage
  oss:
    base-url: https://xxxx.com
    endpoint: oss-cn-shanghai.aliyuncs.com
    access-key-id: access-key-id
    access-key-secret: access-key-secret
    bucket-name: linyu
  s3:
    endpoint: http://127.0.0.1:9000
    access-key-id: WGAJPuUzsmqpky9LxFVR
    access-key-secret: gtMqzFIK2ihbXQkmfnUOyJZEGx90WrDj7AsBTVNc
    bucket-name: linyu
    region: region

#事件总线
event-bus:
  #"local" 或 "rocket"
  type: local
  rocket:
    namesrv:
      - 192.168.166.105:9876
    retry-times: 2

#向量库
vector:
  type: weaviate
  chromem:
    #向量文件存储位置
    path: ./linyu/chromem
  weaviate:
    scheme: http
    host: localhost:8080

auth:
  ldap:
    enabled: true
    host: ldap://127.0.0.1:389
    bind-dn: cn=admin,dc=example,dc=com
    bind-password: admin
    base-dn: dc=example,dc=com
    #ldap查询条件（用于登录名称和密码校验）
    user-filter: (cn=%s)
    #ldap和本地库唯一映射关系
    unique:
      ldap-field: "mobile" #ldap对应的字段key
      local-field: "phone" #本地库对应的字段key（phone,email,id,account）
  gitee:
    client-id: xxx
    client-secret: xxx
    # 桌面端监听地址
    redirect-url: http://127.0.0.1:21120

ai:
  # openai方式调用
  embedding:
    base-url: xxx
    api-key: xxx
    model: text-embedding-3-large
    dimensions: 1024